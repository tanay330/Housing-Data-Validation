
services:

  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    container_name: auth_service
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/auth_db
      SECRET_KEY: your-super-secret-key-change-this-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  validation-service:
    build: ./validation-service
    container_name: validation_service
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/validation_db
      AUTH_SERVICE_URL: http://auth-service:8001
      UPLOAD_DIR: uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads

  nginx:
    build: ./nginx
    container_name: nginx_proxy
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - validation-service

volumes:
  postgres_data:
  uploads_data: